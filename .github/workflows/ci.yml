name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_PASSWORD: ci-not-a-secret
  VED_TEST_DATABASE_URL: postgresql+psycopg://ved:ci-not-a-secret@localhost:5432/ved_test

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: ved
          POSTGRES_PASSWORD: ci-not-a-secret
          POSTGRES_DB: ved_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ved -d ved_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Lint and format
        working-directory: apps/backend
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        working-directory: apps/backend
        run: uv run pytest -q

      - name: Migrations match the models
        working-directory: apps/backend
        env:
          VED_DATABASE_URL: postgresql+psycopg://ved:ci-not-a-secret@localhost:5432/ved
        run: |
          uv run python -c "
          import psycopg
          with psycopg.connect('postgresql://ved:ci-not-a-secret@localhost:5432/ved_test', autocommit=True) as c:
              c.execute('CREATE DATABASE ved')
          "
          uv run alembic upgrade head
          uv run alembic check

  reminders:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: ved
          POSTGRES_PASSWORD: ci-not-a-secret
          POSTGRES_DB: ved_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ved -d ved_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Lint
        working-directory: mcp-servers/reminders
        run: uv run ruff check .

      - name: Test
        working-directory: mcp-servers/reminders
        run: uv run pytest -q

  people:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: ved
          POSTGRES_PASSWORD: ci-not-a-secret
          POSTGRES_DB: ved_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ved -d ved_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Lint
        working-directory: mcp-servers/people
        run: uv run ruff check .

      - name: Test
        working-directory: mcp-servers/people
        run: uv run pytest -q

  memory:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: ved
          POSTGRES_PASSWORD: ci-not-a-secret
          POSTGRES_DB: ved_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ved -d ved_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Lint
        working-directory: mcp-servers/memory
        run: uv run ruff check .

      - name: Test
        working-directory: mcp-servers/memory
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web-client/package-lock.json

      - name: Install
        working-directory: apps/web-client
        run: npm ci

      - name: Lint
        working-directory: apps/web-client
        run: npm run lint

      - name: Build
        working-directory: apps/web-client
        run: npm run build
