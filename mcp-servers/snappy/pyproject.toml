[project]
name = "ved-mcp-snappy"
version = "0.1.0"
description = "Ved MCP server — the user's photos in snappy, over streamable HTTP"
requires-python = ">=3.13"
dependencies = [
    "httpx2>=2.13.0",
    "mcp>=2.2",
    "pydantic-settings>=2.6",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ved_snappy"]

[project.scripts]
ved-mcp-snappy = "ved_snappy.server:main"

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
