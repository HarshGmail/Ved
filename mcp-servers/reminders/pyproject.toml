[project]
name = "ved-mcp-reminders"
version = "0.1.0"
description = "Ved MCP server — reminders"
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.2",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "ved-db",
]

[tool.uv.sources]
ved-db = { path = "../../packages/ved-db", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ved_reminders"]

[project.scripts]
ved-mcp-reminders = "ved_reminders.server:main"

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
