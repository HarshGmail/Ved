[project]
name = "ved-mcp-web"
version = "0.1.0"
description = "Ved MCP server — web search through SearXNG and page reading"
requires-python = ">=3.13"
dependencies = [
    "httpcore2>=2.13.0",
    "httpx2>=2.13.0",
    "lxml>=5.3",
    "mcp>=2.2",
    "pydantic-settings>=2.6",
    "readability-lxml>=0.8.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ved_web"]

[project.scripts]
ved-mcp-web = "ved_web.server:main"

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
