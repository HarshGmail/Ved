<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#0369a1" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="soft"/>
      <feMerge><feMergeNode in="soft"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="haze" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#000"/>
  <circle cx="512" cy="512" r="420" fill="url(#core)"/>
  <circle cx="512" cy="512" r="446" fill="none" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="10" stroke-dasharray="3 21"/>
  <g transform="rotate(-22 512 512)">
    <circle cx="512" cy="512" r="400" fill="none" stroke="url(#beam)" stroke-width="16" stroke-linecap="round" stroke-dasharray="380 70 140 70 600 70 120 1000" filter="url(#glow)"/>
  </g>
  <circle cx="512" cy="512" r="340" fill="none" stroke="#0ea5e9" stroke-opacity="0.35" stroke-width="4"/>
  <g transform="rotate(40 512 512)">
    <circle cx="512" cy="512" r="300" fill="none" stroke="#7dd3fc" stroke-opacity="0.7" stroke-width="8" stroke-dasharray="60 34"/>
  </g>
  <polyline points="372,388 512,654 652,388" fill="none" stroke="#38bdf8" stroke-width="112" stroke-linejoin="miter" stroke-linecap="square" opacity="0.55" filter="url(#haze)"/>
  <polyline points="372,388 512,654 652,388" fill="none" stroke="#e0f7ff" stroke-width="64" stroke-linejoin="miter" stroke-linecap="square" filter="url(#glow)"/>
  <circle cx="512" cy="300" r="20" fill="#67e8f9" filter="url(#glow)"/>
</svg>
