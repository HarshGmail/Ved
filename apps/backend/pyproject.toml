[project]
name = "ved-backend"
version = "0.1.0"
description = "Ved backend — agent orchestration, MCP, memory"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.115",
    "httpx2>=2.13.0",
    "mcp>=2.2",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.6",
    "pypdf>=6.20.0",
    "python-multipart>=0.0.32",
    "pywebpush>=2.5.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.32",
    "ved-db",
]

[tool.uv.sources]
ved-db = { path = "../../packages/ved-db", editable = true }

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=8.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ved_backend"]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.format]
exclude = ["migrations/versions/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
