name: ved

services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ved}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-ved}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ved} -d ${POSTGRES_DB:-ved}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  search:
    image: searxng/searxng:latest
    profiles: ["search"]
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-ultrasecretkey}
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - search-cache:/var/cache/searxng
      - ./searxng/ca-certificates:/usr/local/share/ca-certificates:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      VED_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ved}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ved}
      VED_CORS_ALLOW_ORIGINS: ${VED_CORS_ALLOW_ORIGINS:-["http://localhost:3000"]}
      VED_REMINDERS_SERVER_DIR: /app/mcp-servers/reminders
      VED_PEOPLE_SERVER_DIR: /app/mcp-servers/people
      VED_MEMORY_SERVER_DIR: /app/mcp-servers/memory
      VED_WEB_SERVER_DIR: /app/mcp-servers/web
      VED_SEARCH_PROVIDER: ${VED_SEARCH_PROVIDER:-searxng}
      VED_SEARXNG_URL: http://search:8080
      VED_TIMEZONE: ${VED_TIMEZONE:-Asia/Kolkata}
      VED_LLM_PROVIDER: ${VED_LLM_PROVIDER:-openai-compatible}
      VED_LLM_BASE_URL: ${VED_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      VED_LLM_MODEL: ${VED_LLM_MODEL:-qwen3.6:35b}
      VED_LLM_TIMEOUT_SECONDS: ${VED_LLM_TIMEOUT_SECONDS:-120.0}
      VED_EMBEDDING_MODEL: ${VED_EMBEDDING_MODEL:-nomic-embed-text}
      VED_EMBEDDING_DIMENSIONS: ${VED_EMBEDDING_DIMENSIONS:-768}
      VED_VAPID_PUBLIC_KEY: ${VED_VAPID_PUBLIC_KEY:-}
      VED_VAPID_PRIVATE_KEY: ${VED_VAPID_PRIVATE_KEY:-}
      VED_VAPID_SUBJECT: ${VED_VAPID_SUBJECT:-mailto:ved@example.com}
      VED_SCHEDULER_POLL_SECONDS: ${VED_SCHEDULER_POLL_SECONDS:-30}
      VED_BIRTHDAY_REMINDER_TIME: ${VED_BIRTHDAY_REMINDER_TIME:-09:00}
      VED_DOCUMENTS_DIR: /app/data/documents
      VED_DOCUMENTS_MAX_UPLOAD_BYTES: ${VED_DOCUMENTS_MAX_UPLOAD_BYTES:-26214400}
    volumes:
      - documents:/app/data/documents
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  studio:
    image: sosedoff/pgweb:latest
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ved}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ved}?sslmode=disable
    ports:
      - "127.0.0.1:${STUDIO_PORT:-5050}:8081"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  search-cache:
  documents:
